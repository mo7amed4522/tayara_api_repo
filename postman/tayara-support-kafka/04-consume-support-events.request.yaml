$kind: kafka-request
name: 04 Consume - ticket and FAQ events
description: |-
  Reads tayara.support.chat.events.v1 from the beginning of the log. Bounded: 10 records or
  5 seconds idle.
url:
  - localhost:9092
mode: consumer
topics:
  - name: tayara.support.chat.events.v1
startPosition:
  type: beginning
stopAfter:
  maxRecords: 10
  idleMs: 5000
order: 4000
