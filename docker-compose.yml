# Tayara API — full stack with database GUIs.
#
# Brings up the API plus its three infrastructure dependencies (MySQL, Redis, MongoDB)
# and a browser admin UI for each one so you can click and inspect schemas + data:
#
#   GUI                      URL                   login
#   MySQL  → phpMyAdmin      http://localhost:8080  root / ${MYSQL_ROOT_PASSWORD:-tayara_2026}
#   Redis  → redis-commander http://localhost:8081  (no auth, auto-connects to 'redis')
#   Mongo  → mongo-express   http://localhost:8082  admin / ${MONGO_PASSWORD:-tayara_2026}
#
# Start everything:   docker compose up --build -d
# GUI only:           docker compose up -d phpmyadmin redis-commander mongo-express
# Check health:       docker compose ps
# Logs:               docker compose logs -f app
name: tayara

services:
  mysql:
    image: mysql:latest
    container_name: tayara-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tayara_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tayara}
      MYSQL_USER: ${MYSQL_USER:-tayara}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tayara_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-tayara_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:latest
    container_name: tayara-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Kafka-compatible broker (Redpanda, single node, KRaft — no ZooKeeper).
  # Kafka API on localhost:9092, admin API on localhost:9644.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: tayara-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Browser UI for topics / records / consumer groups.
  redpanda-console:
    image: redpandadata/console:latest
    container_name: tayara-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "${KAFKA_GUI_PORT:-8083}:8080"

  mongo:
    image: mongo:latest
    container_name: tayara-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-tayara_2026}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tayara}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- Database admin GUIs (browser) ---------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tayara-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tayara_2026}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8080}:80"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tayara-redis-commander
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # auto-registers the backend 'redis' as a connection named 'default'
      REDIS_HOSTS: default:redis:6379
    ports:
      - "${REDIS_GUI_PORT:-8081}:8081"

  mongo-express:
    image: mongo-express:latest
    container_name: tayara-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-tayara_2026}
      # GUI login (mongo-express basic auth)
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_GUI_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_GUI_PASSWORD:-tayara_2026}
    ports:
      - "${MONGO_GUI_PORT:-8082}:8081"

  # ---- The API --------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tayara-api
    container_name: tayara-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      # Real Kafka broker for support chat. The config reader expands ${KAFKA_BROKERS}
      # so the container resolves the compose service name, not localhost.
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:29092}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      INSTANCE_ID: ${INSTANCE_ID:-tayara-app}
      # The config reader expands ${...} references (core/viper.go + expandEnv), so these
      # inject Stripe / BNPL secrets from the host without baking them into the image.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TABBY_SECRET_KEY: ${TABBY_SECRET_KEY:-}
      TAMARA_SECRET_KEY: ${TAMARA_SECRET_KEY:-}
    ports:
      - "${APP_PORT:-8888}:8888"
    volumes:
      # runtime config + Firebase service account are mounted (not baked) to avoid secrets in the image.
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./firebase:/app/firebase:ro
      - app-uploads:/app/uploads

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  redpanda-data:
  app-uploads: