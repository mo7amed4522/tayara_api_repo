# huawei obs configuration
hua-wei-obs:
    path: /uploads
    bucket: tayara-bucket  # FIXED (was "bucket-here")
    endpoint: obs.cn-north-1.myhuaweicloud.com  # FIXED (was "endpoint-here")
    access-key: your-huawei-access-key  # FIXED (was "access-key-here")
    secret-key: your-huawei-secret-key  # FIXED (was "secret-key-here")

# stripe payment configuration
stripe:
    secret-key: sk_test_your_secret_key
    publishable-key: pk_test_your_publishable_key
    webhook-secret: whsec_your_webhook_secret
    currency: AED
    capture-method: manual
    auto-capture: false
    payment-hold-hours: 2

# excel configuration
excel:
    dir: ./resource/excel

# timer task db clear table
Timer:
    start: true
    spec: "@daily"
    detail:
        - tableName: logs  # FIXED (was "table-name-here")
          compareField: created_at  # FIXED (was "compare-field-here")
          interval: 30  # FIXED (was "interval-here") - keep logs for 30 days
        - tableName: sessions  # FIXED (was "table-name-here")
          compareField: updated_at  # FIXED (was "compare-field-here")
          interval: 7  # FIXED (was "interval-here") - keep sessions for 7 days

# Cross-domain configuration
cors:
  mode: whitelist
  whitelist:
    # Port 3000 (original)
    - allow-origin: http://localhost:3000
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    # Port 3001
    - allow-origin: http://localhost:3001
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    # Port 3050
    - allow-origin: http://localhost:3050
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    # Port 8080
    - allow-origin: http://localhost:8080
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    # Port 8000
    - allow-origin: http://localhost:8000
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true

