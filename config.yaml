# jwt configuration
jwt:
    signing-key: tayar
    expires-time: 7d  # 2 hours in seconds - FIXED (was 7)
    buffer-time: 5h    # 5 minutes in seconds - FIXED (was "b1")
    issuer: tayara-api  # FIXED (was "issuer-here")

# zap logger configuration
zap:
    level: info
    format: console
    prefix: "[tayara-api]"  # FIXED (was "[prefix-here]")
    director: log
    show-line: true
    encode-level: LowercaseColorLevelEncoder
    stacktrace-key: stacktrace
    log-in-console: true

# redis configuration
redis:
    db: 0
    addr: localhost:6379  # FIXED (was "addr-here:6379")
    password: ""

# mongo configuration
mongo:
    coll: tayara  # FIXED (was "coll-here")
    options: ""  # FIXED (was "options-here")
    database: tayara  # FIXED (was "database-here")
    username: admin  # FIXED (was "username-here")
    password: tayara_2026  # FIXED (was "password-here")
    min-pool-size: 0
    max-pool-size: 100
    socket-timeout-ms: 0
    connect-timeout-ms: 0
    is-zap: false
    hosts:
        - host: "localhost"  # FIXED (was "")
          port: "27017"      # FIXED (was "")

# email configuration
email:
    to: admin@tayara.com  # FIXED (was "to-here")
    port: 465
    from: noreply@tayara.com  # FIXED (was "from-here")
    host: smtp.163.com
    is-ssl: true
    secret: your-email-password  # FIXED (was "secret-here")
    nickname: Tayara Team  # FIXED (was "nickname-here")

# system configuration
system:
    env: local
    addr: 8888
    db-type: mysql
    oss-type: local
    use-redis: true
    use-mongo: false
    use-multipoint: false
    iplimit-count: 15000
    iplimit-time: 3600

# captcha configuration
captcha:
    key-long: 6
    img-width: 240
    img-height: 80
    open-captcha: 0
    open-captcha-timeout: 3600

# mysql connect configuration
mysql:
    path: localhost
    port: "3307"
    config: charset=utf8mb4&parseTime=True&loc=Local
    db-name: tayara
    username: root
    password: tayara_2026
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: error
    log-zap: false

# pgsql connect configuration
pgsql:
    path: localhost  # FIXED (was "path-here")
    port: "5432"     # FIXED (was "port-here")
    config: sslmode=disable  # FIXED (was "config-here")
    db-name: tayara  # FIXED (was "db-name-here")
    username: postgres  # FIXED (was "username-here")
    password: postgres  # FIXED (was "password-here")
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: "error"
    log-zap: false

db-list:
    - disable: true
      type: ""
      alias-name: ""
      path: ""
      port: ""
      config: ""
      db-name: ""
      username: ""
      password: ""
      max-idle-conns: 10
      max-open-conns: 100
      log-mode: ""
      log-zap: false

# local configuration
local:
