# jwt configuration
jwt:
    signing-key: 8f3b9a6c2e5d4f1a7b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8  # JWT signing key (>=32 chars)
    expires-time: 7d                      # Token expiration: 7 days
    buffer-time: 5h                       # Refresh buffer: 5 hours
    issuer: tayara-api                    # Token issuer identifier

# zap logger configuration
zap:
    level: info                           # Log level (info, debug, warn, error)
    format: console                       # Output format (console or json)
    prefix: "[tayara-api]"                # Log message prefix
    director: log                         # Log directory
    show-line: true                       # Show file and line number
    encode-level: LowercaseColorLevelEncoder # Level encoding style
    stacktrace-key: stacktrace            # Key for stacktrace in logs
    log-in-console: true                  # Output logs to console

# redis configuration
redis:
    db: 0                                 # Redis database index
    addr: localhost:6379                  # Redis server address
    password: ""                          # Redis password (empty if none)

# mongo configuration
mongo:
    coll: tayara                          # Default MongoDB collection
    options: ""                           # Additional connection options
    database: tayara                      # MongoDB database name
    username: admin                       # MongoDB username
    password: tayara_2026                 # MongoDB password
    min-pool-size: 0                      # Minimum connection pool size
    max-pool-size: 100                    # Maximum connection pool size
    socket-timeout-ms: 0                  # Socket timeout in ms (0 = no timeout)
    connect-timeout-ms: 0                 # Connection timeout in ms
    is-zap: false                         # Use zap for Mongo logs
    hosts:
        - host: "localhost"               # MongoDB host
          port: "27017"                   # MongoDB port

# email configuration
email:
    to: admin@tayara.com                  # Default recipient address
    port: 465                             # SMTP port (SSL)
    from: noreply@tayara.com              # Sender address
    host: smtp.163.com                    # SMTP server host
    is-ssl: true                          # Use SSL connection
    secret: your-email-password           # SMTP authentication password
    nickname: Tayara Team                 # Display name for sender

# system configuration
system:
    env: local                            # Environment (local, dev, prod)
    addr: 8888                            # Server listening port
    db-type: mysql                        # Primary database type
    oss-type: local                       # Object storage type (local, qiniu, etc.)
    use-redis: true                       # Enable Redis
    use-mongo: true                      # Enable MongoDB
    use-multipoint: false                 # Enable multi-point login
    iplimit-count: 15000                  # IP rate limit request count
    iplimit-time: 3600                    # IP rate limit window (seconds)

# captcha configuration
captcha:
    key-long: 6                           # Captcha key length
    img-width: 240                        # Captcha image width
    img-height: 80                        # Captcha image height
    open-captcha: 0                       # Captcha on/off (0 = off)
    open-captcha-timeout: 3600            # Captcha timeout (seconds)

# mysql connect configuration
mysql:
    path: localhost                       # MySQL host
    port: "3306"                          # MySQL port
    config: charset=utf8mb4&parseTime=True&loc=Local # Connection parameters
    db-name: tayara                       # Database name
    username: root                        # MySQL username
    password: tayara_2026                 # MySQL password
    max-idle-conns: 10                    # Max idle connections
    max-open-conns: 100                   # Max open connections
    log-mode: error                       # GORM log level
    log-zap: false                        # Use zap for GORM logs

# pgsql connect configuration
pgsql:
    path: localhost                       # PostgreSQL host
    port: "5432"                          # PostgreSQL port
    config: sslmode=disable               # Connection config
    db-name: tayara                       # Database name
    username: postgres                    # PostgreSQL username
    password: postgres                    # PostgreSQL password
    max-idle-conns: 10
    max-open-conns: 100
    log-mode: "error"
    log-zap: false

db-list:                                 # Additional databases list (empty entry disabled)
    - disable: true
      type: ""
      alias-name: ""
      path: ""
      port: ""
      config: ""
      db-name: ""
      username: ""
      password: ""
      max-idle-conns: 10
      max-open-conns: 100
      log-mode: ""
      log-zap: false

# local storage configuration (used when oss-type = local)
local:
    path: uploads                         # Upload directory path
    store-path: uploads                   # Stored files path

# autocode configuration
autocode:
    transfer-restart: true                # Restart server after code generation
    root: /Users/mo7/projects/tayara-api  # Project root path
    server: /server
    server-plug: /plugin/%s
    server-api: /api/v1/%s
    server-initialize: /initialize
    server-model: /model/%s
    server-request: /model/%s/request
    server-router: /router/%s
    server-service: /service/%s
    web: /web/src
    web-api: /api
    web-form: /view
    web-table: /view

# qiniu cloud storage configuration
qiniu:
    zone: ZoneHuaDong                     # Storage zone
    bucket: tayara-bucket                 # Bucket name
    img-path: "/images"                   # Image path prefix
    use-https: false                      # Use HTTPS
    access-key: your-qiniu-access-key     # Access key
    secret-key: your-qiniu-secret-key     # Secret key
    use-cdn-domains: false                # Use CDN domains

# aliyun oss configuration
aliyun-oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com # OSS endpoint
    access-key-id: your-aliyun-access-key  # Access key ID
    access-key-secret: your-aliyun-secret-key # Access key secret
    bucket-name: tayara-bucket             # Bucket name
    bucket-url: https://tayara-bucket.oss-cn-hangzhou.aliyuncs.com # Bucket URL
    base-path: /uploads                    # Base path for uploads

# tencent cos configuration
tencent-cos:
    bucket: tayara-10005608                # Bucket name
    region: ap-shanghai                    # Region
    secret-id: your-tencent-secret-id      # Secret ID
    secret-key: your-tencent-secret-key    # Secret key
    base-url: https://tayara-10005608.cos.ap-shanghai.myqcloud.com # Base URL
    path-prefix: /uploads                  # Path prefix

# aws s3 configuration
aws-s3:
    bucket: tayara-bucket                  # S3 bucket name
    region: us-east-1                      # AWS region
    endpoint: s3.amazonaws.com             # S3 endpoint
    s3-force-path-style: false             # Force path-style URLs
    disable-ssl: false                     # Disable SSL
    secret-id: your-aws-access-key         # AWS access key
    secret-key: your-aws-secret-key        # AWS secret key
    base-url: https://tayara-bucket.s3.amazonaws.com # Base URL
    path-prefix: /uploads

# huawei obs configuration
hua-wei-obs:
    path: /uploads
    bucket: tayara-bucket                  # Bucket name
    endpoint: obs.cn-north-1.myhuaweicloud.com # OBS endpoint
    access-key: your-huawei-access-key     # Access key
    secret-key: your-huawei-secret-key     # Secret key

# cloudflare-r2 object storage configuration (S3-compatible; used when oss-type = cloudflare-r2)
# Values are injected from the environment - set R2_* variables at deploy time.
cloudflare-r2:
    bucket: ${R2_BUCKET:-tayara-media}          # R2 bucket name
    base-url: ${R2_PUBLIC_URL:-media.tayara.com} # public URL / r2.dev host (no scheme)
    path: ${R2_PATH:-uploads}                   # object key prefix
    account-id: ${R2_ACCOUNT_ID}                # Cloudflare account id
    access-key-id: ${R2_ACCESS_KEY_ID}          # R2 access key id
    secret-access-key: ${R2_SECRET_ACCESS_KEY}  # R2 secret access key

# stripe payment configuration
stripe:
    secret-key: ${STRIPE_SECRET_KEY:-sk_test_your_secret_key}                 # Stripe secret key (from env, never committed)
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:-pk_test_your_publishable_key}  # Stripe publishable key (from env)
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:-whsec_your_webhook_secret}       # Webhook signing secret (from env)
    currency: AED                                    # Default currency (UAE Dirham)
    capture-method: manual                           # Payment capture method
    auto-capture: false                              # Auto-capture payments
    payment-hold-hours: 2                            # Payment hold period in hours
    # Active Stripe payment methods: visa, mastercard, apple_pay, google_pay
    payment-methods: [card, apple_pay, google_pay]
    fee-bps: 250                                     # Platform Stripe fee, basis points (2.5%)

# payment (orchestrator): BNPL Buy-Now-Pay-Later providers + the methods offered to clients
payment:
    enabled-methods: [card, apple_pay, google_pay, tabby, tamara]
    tabby:
        enabled: true
        base-url: ${TABBY_BASE_URL:-https://api.tabby.ai}       # sandbox: https://api.tabby.ai
        secret-key: ${TABBY_SECRET_KEY:-pk_test_your_tabby_key} # secret (from env)
        webhook-secret: ${TABBY_WEBHOOK_SECRET:-}
        currency: AED
    tamara:
        enabled: true
        base-url: ${TAMARA_BASE_URL:-https://api.tamara.co}     # sandbox: https://api-sandbox.tamara.co
        secret-key: ${TAMARA_SECRET_KEY:-pk_test_your_tamara_key}
        webhook-secret: ${TAMARA_WEBHOOK_SECRET:-}
        currency: AED

# excel configuration
excel:
    dir: ./resource/excel                 # Directory for Excel files

# timer task db clear table
Timer:
    start: true                           # Enable timer
    spec: "@daily"                        # Cron expression (daily)
    detail:
        - tableName: logs                 # Table to clean
          compareField: created_at        # Field to compare
          interval: 30                    # Keep records for 30 days
        - tableName: sessions             # Table to clean
          compareField: updated_at        # Field to compare
          interval: 7                     # Keep records for 7 days

# Cross-domain (CORS) configuration
cors:
  mode: whitelist                        # CORS mode: whitelist
  whitelist:
    - allow-origin: http://localhost:3000 # Allowed origin
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    - allow-origin: http://localhost:3001
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    - allow-origin: http://localhost:3050
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    - allow-origin: http://localhost:8080
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true
    
    - allow-origin: http://localhost:8000
      allow-headers: content-type, X-token, A-token, S-token
      allow-methods: GET, POST, PUT, DELETE, OPTIONS
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-token, A-token, S-token
      allow-credentials: true

