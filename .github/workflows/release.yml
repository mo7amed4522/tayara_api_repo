name: Release

# Triggered when a version tag is pushed (e.g., v1.0.0, v2.1.3).
# Regenerates Swagger docs with the pinned swag v1.8.12, builds binaries for
# multiple platforms, and creates a GitHub release with all artifacts attached.
on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: "1.25"
  SWAG_VERSION: "v1.8.12"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@${{ env.SWAG_VERSION }}

      - name: Regenerate Swagger docs
        run: |
          $(go env GOPATH)/bin/swag init -g main.go -o docs
          echo "✓ Swagger docs regenerated with swag ${{ env.SWAG_VERSION }}"

      - name: Download dependencies
        run: go mod download

      - name: Build for multiple platforms
        run: |
          mkdir -p dist

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o dist/tayara-api-linux-amd64 -ldflags="-s -w" .

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o dist/tayara-api-linux-arm64 -ldflags="-s -w" .

          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/tayara-api-darwin-amd64 -ldflags="-s -w" .

          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o dist/tayara-api-darwin-arm64 -ldflags="-s -w" .

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -o dist/tayara-api-windows-amd64.exe -ldflags="-s -w" .

          echo "✓ Built binaries for 5 platforms"

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "✓ Generated checksums"

      - name: Package Swagger docs
        run: |
          tar -czf dist/swagger-docs.tar.gz docs/
          echo "✓ Packaged Swagger docs"

      - name: Extract release notes
        id: release_notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Extract version from tag
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.release_notes.outputs.tag_name }}
          body: |
            ## Release ${{ steps.release_notes.outputs.tag_name }}

            ### 📦 Binaries
            Built with Go ${{ env.GO_VERSION }} for multiple platforms.

            ### 📄 API Documentation
            Swagger docs regenerated with `swag ${{ env.SWAG_VERSION }}`:
            - Download `swagger-docs.tar.gz` for the complete OpenAPI specification
            - View online at your deployed API endpoint: `/swagger/index.html`

            ### ✅ Verification
            All binaries have been verified with checksums in `checksums.txt`.

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.release_notes.outputs.tag_name }}...HEAD
          files: |
            dist/tayara-api-*
            dist/swagger-docs.tar.gz
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Build and push Docker image with version tag
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push versioned container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release_notes.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:${{ steps.release_notes.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64

  notify:
    name: Post-release notifications
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Summary
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Binaries for 5 platforms (Linux, macOS, Windows)" >> $GITHUB_STEP_SUMMARY
          echo "- Swagger docs (swag ${{ env.SWAG_VERSION }})" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images with version tags" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256 checksums" >> $GITHUB_STEP_SUMMARY
